<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <defs>
    <style>
      .t { fill: #d6d6dc }
      .m { fill: #7c7c86 }
      .a { fill: #8b5cf6 }
      .ok { fill: #1a9450 }
      .wn { fill: #a87700 }
      .bl { fill: #2f7bf0 }
      .bg { fill: #1a1a1f }
      .ln { stroke: #34343c; fill: none }
    </style>
  </defs>

  <!-- window -->
  <rect x="0.5" y="0.5" width="879" height="419" rx="12" class="bg" stroke="#2c2c33"/>
  <circle cx="20" cy="18" r="5" fill="#ff5f57"/><circle cx="38" cy="18" r="5" fill="#febc2e"/><circle cx="56" cy="18" r="5" fill="#28c840"/>
  <text x="440" y="22" text-anchor="middle" class="m">claude · ~/code/app</text>

  <!-- transcript -->
  <g>
    <text x="24" y="60" class="a">›</text><text x="40" y="60" class="t">fix the login bug</text>
    <text x="24" y="86" class="m">●</text><text x="40" y="86" class="t">Reading the auth module first.</text>
    <text x="40" y="110" class="bl">Read</text><text x="78" y="110" class="m">src/auth.ts</text>
    <text x="40" y="132" class="wn">Edit</text><text x="78" y="132" class="m">src/auth.ts</text><text x="170" y="132" class="ok">+4</text><text x="192" y="132" fill="#e5484d">−1</text>
    <text x="40" y="154" class="ok">Bash</text><text x="78" y="154" class="m">npm test</text>
  </g>

  <!-- working popup (compact mode): appears at 1s, leaves at 5s -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.12;0.16;0.6;0.64;1" dur="9s" repeatCount="indefinite"/>
    <rect x="24" y="238" width="400" height="86" rx="8" class="ln" stroke="#8b5cf6"/>
    <text x="40" y="260" class="a" font-weight="600">◆ AshPack</text><text x="118" y="260" class="t">Testing…</text><text x="408" y="260" text-anchor="end" class="m">2/3 · 14s</text>
    <text x="40" y="284" class="ok">✓ Read the code</text>
    <text x="40" y="306" class="a" font-weight="600">▸ Fix the card</text>
    <!-- wave -->
    <g transform="translate(200 297)" fill="#8b5cf6">
      <rect x="0" width="4" rx="2" height="3" y="4.5"><animate attributeName="height" values="3;12;3" dur="0.9s" begin="0s" repeatCount="indefinite"/><animate attributeName="y" values="4.5;0;4.5" dur="0.9s" begin="0s" repeatCount="indefinite"/></rect>
      <rect x="7" width="4" rx="2" height="3" y="4.5"><animate attributeName="height" values="3;12;3" dur="0.9s" begin="-0.1s" repeatCount="indefinite"/><animate attributeName="y" values="4.5;0;4.5" dur="0.9s" begin="-0.1s" repeatCount="indefinite"/></rect>
      <rect x="14" width="4" rx="2" height="3" y="4.5"><animate attributeName="height" values="3;12;3" dur="0.9s" begin="-0.2s" repeatCount="indefinite"/><animate attributeName="y" values="4.5;0;4.5" dur="0.9s" begin="-0.2s" repeatCount="indefinite"/></rect>
      <rect x="21" width="4" rx="2" height="3" y="4.5"><animate attributeName="height" values="3;12;3" dur="0.9s" begin="-0.3s" repeatCount="indefinite"/><animate attributeName="y" values="4.5;0;4.5" dur="0.9s" begin="-0.3s" repeatCount="indefinite"/></rect>
      <rect x="28" width="4" rx="2" height="3" y="4.5"><animate attributeName="height" values="3;12;3" dur="0.9s" begin="-0.4s" repeatCount="indefinite"/><animate attributeName="y" values="4.5;0;4.5" dur="0.9s" begin="-0.4s" repeatCount="indefinite"/></rect>
      <rect x="35" width="4" rx="2" height="3" y="4.5"><animate attributeName="height" values="3;12;3" dur="0.9s" begin="-0.5s" repeatCount="indefinite"/><animate attributeName="y" values="4.5;0;4.5" dur="0.9s" begin="-0.5s" repeatCount="indefinite"/></rect>
    </g>
    <text x="40" y="320" class="m">○ Run tests</text>
  </g>

  <!-- status strip: shown while the popup is not -->
  <g>
    <animate attributeName="opacity" values="1;1;0;0;1;1" keyTimes="0;0.12;0.16;0.6;0.64;1" dur="9s" repeatCount="indefinite"/>
    <text x="24" y="314" class="a" font-weight="600">◆ Opus 5.5</text><text x="104" y="314" class="bl">· ● high</text>
    <text x="178" y="314" class="ok">⎇ main</text><text x="236" y="314" class="wn">●1</text>
    <text x="280" y="314" class="m">ctx</text>
    <g transform="translate(308 305)"><rect width="7" height="7" rx="1.5" fill="#1a9450"/><rect x="10" width="7" height="7" rx="1.5" fill="#1a9450"/><rect x="20" width="7" height="7" rx="1.5" fill="#1a9450" opacity=".25"/><rect x="30" width="7" height="7" rx="1.5" fill="#1a9450" opacity=".25"/><rect x="40" width="7" height="7" rx="1.5" fill="#1a9450" opacity=".25"/><rect x="50" width="7" height="7" rx="1.5" fill="#1a9450" opacity=".25"/></g>
    <text x="372" y="314" class="ok">24%</text>
    <text x="414" y="314" class="m">session</text>
    <g transform="translate(474 305)"><rect width="7" height="7" rx="1.5" fill="#a87700"/><rect x="10" width="7" height="7" rx="1.5" fill="#a87700"/><rect x="20" width="7" height="7" rx="1.5" fill="#a87700"/><rect x="30" width="7" height="7" rx="1.5" fill="#a87700"/><rect x="40" width="7" height="7" rx="1.5" fill="#a87700" opacity=".25"/><rect x="50" width="7" height="7" rx="1.5" fill="#a87700" opacity=".25"/></g>
    <text x="538" y="314" class="wn">70%</text><text x="572" y="314" class="m">↻16m</text>
    <text x="630" y="314" class="m">baton · 2 waiting</text>
  </g>

  <!-- prompt -->
  <rect x="24" y="334" width="832" height="36" rx="8" class="ln"/>
  <text x="38" y="357" class="m">Type / for commands</text>

  <!-- footer -->
  <text x="24" y="398" class="m">⏵⏵ auto mode on</text>
  <text x="856" y="398" text-anchor="end" class="t">AshPack ▸</text>
  <text x="776" y="398" text-anchor="end" class="a">◆</text>

  <!-- drawer: slides in at 6s -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="300 0;300 0;0 0;0 0;300 0;300 0" keyTimes="0;0.66;0.7;0.96;1;1" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.2 0 0 1;0 0 1 1;.4 0 1 1;0 0 1 1"/>
    <rect x="560" y="34" width="296" height="290" rx="10" fill="#1e1e24" stroke="#3a3a44"/>
    <text x="576" y="58" class="a" font-weight="600">◆ AshPack</text><text x="652" y="58" class="m">· your mods, one place</text>
    <text x="576" y="88" class="m">Home</text>
    <text x="624" y="88" class="t" font-weight="600">Status</text>
    <rect x="624" y="93" width="44" height="2" fill="#8b5cf6"/>
    <text x="682" y="88" class="m">Skins</text>
    <text x="730" y="88" class="m">Baton</text>
    <text x="576" y="124" class="t" font-weight="600">Compact mode</text>
    <text x="576" y="142" class="m">Hide tool rows; a popup shows the work.</text>
    <text x="840" y="124" text-anchor="end" class="ok">● ON</text>
    <text x="576" y="176" class="t" font-weight="600">Status chips</text>
    <text x="576" y="194" class="m">Model, branch, context and usage.</text>
    <text x="840" y="176" text-anchor="end" class="ok">● ON</text>
    <text x="576" y="236" class="m">A mod joins with one Box keyed</text>
    <text x="576" y="254" class="m">"ashpack-page:Label". See ADOPTING.md.</text>
  </g>
</svg>
